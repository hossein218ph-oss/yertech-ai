services:
  - type: web
    name: yertech-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BALE_BOT_TOKEN
        sync: false
      - key: BALE_CHANNEL
        value: "@Yertech"
      - key: TEST_MESSAGE
        value: "🚀 سلام از Yertech AI! اتصال ربات به کانال فناوری‌یار با موفقیت تست شد. 🤖"
